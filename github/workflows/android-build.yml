name: Build APK on: push: branches: [ "main" ] 
  workflow_dispatch: # به شما اجازه می‌دهد دستی هم بیلد 
  بگیرید
jobs: build: runs-on: ubuntu-latest steps: - name: 
    Checkout code
      uses: actions/checkout@v4 - name: Set up JDK 17 
      uses: actions/setup-java@v4 with:
        java-version: '17' distribution: 'temurin' cache: 
        gradle
    - name: Grant execute permission for gradlew run: 
      chmod +x gradlew
    - name: Build with Gradle run: ./gradlew 
      assembleDebug # یا assembleRelease برای نسخه ریلیز
    - name: Upload APK uses: actions/upload-artifact@v4 
      with:
        name: my-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
